# gh review-kit init이 만든 파일. 분류·게이트 로직은 devheedoo/gh-review-kit에 있다.
# 이 저장소에서 정할 것은 아래 with: 값뿐이다. 이 파일을 고치는 PR은 risk:high로 분류된다.
#
# 공통 high 경로(모든 저장소): .github/, REVIEW.md, package.json, lockfile, tsconfig·빌드·lint 설정
# 패턴은 bash case glob이다. `*`는 `/`도 넘으므로 `src/payment/*`는 하위 폴더까지 걸린다.
name: review-kit-risk

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  statuses: write  # human-review 커밋 상태를 남긴다

# 판단은 이벤트 종류가 아니라 현재 라벨·head 커밋 상태로 하므로 취소돼도 마지막 실행이 다시 판단한다.
concurrency:
  group: review-kit-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-kit-risk:
    uses: devheedoo/gh-review-kit/.github/workflows/risk.yml@v1
    with:
      # 이 저장소에서 사람이 꼭 봐야 하는 경로 (금액·인증·결제·데이터 삭제 등). 공백·줄바꿈 구분.
      # TODO: 채우기 전에는 공통 high 경로만 적용된다. 예) src/payment/* src/auth/*
      high-paths: "src/pay.js"
      # 문서·화면 문구처럼 위험이 낮은 경로. 예) *.md src/copy.ts
      low-paths: "*.md"
      # 변경 줄 수 합계(lockfile 제외)가 이 값을 넘으면 high
      size-threshold: 400
      # false면 high PR도 막지 않고 경고만 남긴다 (ruleset을 걸 수 없는 private 저장소)
      enforce: true
